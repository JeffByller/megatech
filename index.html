<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Megatech · Serviços</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f6fa;color:#20283e;font:16px system-ui}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:13px 18px;background:#3559ce;color:white}button.secondary{background:#edf0fa;color:#3559ce}header{background:white;border-bottom:1px solid #e5e7ef;padding:22px max(22px,calc((100vw - 1080px)/2));display:flex;justify-content:space-between;align-items:center}header b{font-size:23px;letter-spacing:-1px}header small{color:#787f94}main{max-width:1080px;margin:auto;padding:32px 20px 100px}h1{font-size:30px;letter-spacing:-1px;margin:8px 0}p{color:#737c91;line-height:1.6}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:26px 0}.stat,.card,section{background:white;border:1px solid #e5e7ef;border-radius:16px;padding:22px}.stat span{display:block;color:#747c91;font-size:14px}.stat strong{display:block;font-size:27px;margin-top:10px}nav{display:flex;gap:8px;overflow:auto;margin:22px 0}nav button{white-space:nowrap;background:white;color:#64708b}nav button.active{background:#e8edff;color:#3559ce}#search{width:100%;margin-bottom:18px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.card{cursor:pointer;transition:box-shadow .2s}.card:hover{box-shadow:0 6px 24px #20283e10}.card h3{margin:15px 0 6px}.card p{margin:4px 0;font-size:14px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.badge{font-size:13px;background:#efebfc;color:#7352b5;padding:6px 10px;border-radius:7px}.price{font-size:21px;font-weight:650}.muted{color:#81889a;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:block;color:#64708b;font-size:14px}input,select{display:block;border:1px solid #dce0eb;border-radius:9px;padding:12px;width:100%;background:white;color:#20283e;margin-top:6px}section{margin:18px 0}section h2{font-size:18px;margin:0 0 20px}.items{display:grid;grid-template-columns:2fr .7fr 1fr auto;gap:8px;margin-bottom:12px}.items button{padding:10px;background:#f7ebee;color:#b85066}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}.total{font-size:28px;color:#3559ce}.notice{background:#eeebfa;color:#73618e;border-radius:10px;padding:12px 16px;font-size:13px;margin-top:30px}#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#20283e;color:white;padding:14px 24px;border-radius:12px;display:none;z-index:5}@media(max-width:600px){header{padding:18px 20px}header small{font-size:12px}main{padding-top:24px}.top{align-items:start}h1{font-size:26px}.top button{padding:12px;font-size:14px}.stats{gap:8px}.stat{padding:15px 10px}.stat strong{font-size:22px}.stat span{font-size:12px}.cards{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.items{grid-template-columns:1fr 1fr auto;border-bottom:1px solid #eee;padding-bottom:16px}.items label:first-child{grid-column:1/-1}section{padding:18px}}@media print{header,.actions,.notice,button{display:none!important}body{background:white}main{padding:0}section,.items{break-inside:avoid}input,select{border:0;padding:2px}section{border:0}.grid{grid-template-columns:1fr 1fr}}
</style><header><b>megatech<span style="color:#6f55bb">.</span></b><small>Gestão de serviços</small></header><main id="app"></main><div id="toast" role="status"></div><script>
const key='megatech-demo-v1',app=document.querySelector('#app');const money=n=>Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>new Date().toLocaleDateString('en-CA');let orders;try{orders=JSON.parse(localStorage.getItem(key))}catch{}if(!Array.isArray(orders))orders=[{id:1001,name:'Marina Oliveira',title:'Instalação de câmeras IP',date:'2026-11-18',status:'Em execução',phone:'(81) 90000-1001',whatsapp:'(81) 90000-1001',street:'Rua das Flores',number:'120',district:'Centro',city:'Recife',state:'PE',items:[{desc:'Câmera IP',qty:2,price:280},{desc:'Cabo de rede (metro)',qty:50,price:3.5},{desc:'Instalação e configuração',qty:1,price:350,type:'service'}]},{id:1002,name:'Carlos Santos',title:'Manutenção de rede',date:'2026-11-18',status:'Orçamento',items:[{desc:'Conector RJ45',qty:10,price:2.5},{desc:'Revisão da rede',qty:1,price:180,type:'service'}]},{id:1003,name:'Ana Costa',title:'Troca de DVR',date:'2026-11-17',status:'Concluído',items:[{desc:'DVR 8 canais',qty:1,price:650},{desc:'Substituição e configuração',qty:1,price:200,type:'service'}]}];let filter='Todos',query='',draft;const sum=o=>o.items.reduce((s,i)=>s+i.qty*i.price,0);function persist(){try{localStorage.setItem(key,JSON.stringify(orders));return true}catch{alert('Não foi possível salvar neste navegador. Verifique o espaço disponível.');return false}}function toast(t){let e=document.querySelector('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2500)}function home(){app.innerHTML=`<div class="top"><div><div class="muted">SEU DIA DE TRABALHO</div><h1>Atendimentos</h1><p style="margin:4px 0">Tudo organizado, da visita à entrega.</p></div><button onclick="edit()">+ Novo orçamento</button></div><div class="stats"><div class="stat"><span>Em aberto</span><strong>${orders.filter(o=>o.status!=='Concluído').length}</strong></div><div class="stat"><span>Concluídos</span><strong>${orders.filter(o=>o.status==='Concluído').length}</strong></div><div class="stat"><span>Total previsto</span><strong style="font-size:20px">${money(orders.reduce((s,o)=>s+sum(o),0))}</strong></div></div><input id="search" aria-label="Buscar atendimento" placeholder="Buscar por cliente ou número…" value="${esc(query)}"><nav>${['Todos','Orçamento','Aprovado','Em execução','Concluído'].map(s=>`<button class="${filter===s?'active':''}" onclick="filter='${s}';home()">${s}</button>`).join('')}</nav><div class="cards" id="cards"></div><div class="notice">Versão de demonstração · Dados fictícios salvos somente neste navegador.</div>`;document.querySelector('#search').oninput=e=>{query=e.target.value;cards()};cards()}function cards(){let list=orders.filter(o=>(filter==='Todos'||o.status===filter)&&(`${o.name} ${o.id}`.toLowerCase().includes(query.toLowerCase())));document.querySelector('#cards').innerHTML=list.map(o=>`<article class="card" tabindex="0" role="button" onclick="edit(${o.id})" onkeydown="if(event.key==='Enter')edit(${o.id})"><div class="row"><span class="muted">#${o.id} · ${esc(o.date.split('-').reverse().join('/'))}</span><span class="badge">${o.status}</span></div><h3>${esc(o.name)}</h3><p>${esc(o.title)}</p><div class="row" style="margin-top:24px"><strong class="price">${money(sum(o))}</strong><span class="muted">Ver atendimento</span></div></article>`).join('')||'<p>Nenhum atendimento encontrado.</p>'}const fields=[['name','Nome do(a) cliente'],['phone','Telefone'],['whatsapp','WhatsApp'],['email','E-mail'],['street','Logradouro'],['number','Número'],['district','Bairro'],['city','Cidade'],['zip','CEP'],['state','Estado']];function edit(id){draft=id?structuredClone(orders.find(o=>o.id===id)):{id:Math.max(1000,...orders.map(o=>o.id))+1,date:today(),status:'Orçamento',name:'',title:'',items:[]};app.innerHTML=`<button class="secondary" onclick="leave()">Voltar aos atendimentos</button><div class="top" style="margin-top:24px"><div><div class="muted">ATENDIMENTO #${draft.id}</div><h1>${id?'Detalhes do atendimento':'Novo orçamento'}</h1></div><span class="badge">${draft.status}</span></div><form id="form"><section><h2>Informações do atendimento</h2><div class="grid"><label>Descrição do serviço<input name="title" required value="${esc(draft.title)}" placeholder="Ex.: Instalação de câmeras"></label><label>Data<input type="date" name="date" required value="${draft.date}"></label><label>Etapa<select name="status">${['Orçamento','Aprovado','Em execução','Concluído'].map(s=>`<option ${draft.status===s?'selected':''}>${s}</option>`).join('')}</select></label></div></section><section><h2>Cliente e endereço</h2><div class="grid">${fields.map(([k,l])=>`<label>${l}<input name="${k}" ${k==='name'?'required':''} type="${k==='email'?'email':['phone','whatsapp'].includes(k)?'tel':'text'}" value="${esc(draft[k])}"></label>`).join('')}</div></section><section><h2>Materiais e equipamentos</h2><div id="materials"></div><button type="button" class="secondary" onclick="add('material')">+ Adicionar material</button></section><section><h2>Mão de obra</h2><div id="services"></div><button type="button" class="secondary" onclick="add('service')">+ Adicionar serviço</button></section><section><div class="row"><span>Materiais</span><strong id="matTotal"></strong></div><div class="row" style="margin:16px 0"><span>Mão de obra</span><strong id="srvTotal"></strong></div><hr style="border:0;border-top:1px solid #eee"><div class="row" style="margin-top:20px"><strong>Total do atendimento</strong><strong class="total" id="total"></strong></div></section><div class="actions"><button type="submit">Salvar atendimento</button><button type="button" class="secondary" onclick="if(document.querySelector('#form').reportValidity()){save(false);window.print()}">Imprimir / PDF</button></div></form>`;document.querySelector('#form').onsubmit=e=>{e.preventDefault();save(true)};items();window.scrollTo(0,0)}function leave(){if(confirm('Voltar à lista? Alterações não salvas serão descartadas.'))home()}function add(type){draft.items.push({desc:'',qty:1,price:0,type});items()}function items(){for(let type of ['material','service'])document.querySelector(type==='material'?'#materials':'#services').innerHTML=draft.items.map((i,n)=>({i,n})).filter(({i})=>(i.type||'material')===type).map(({i,n})=>`<div class="items"><label>${n+1}. Descrição<input required value="${esc(i.desc)}" oninput="draft.items[${n}].desc=this.value" placeholder="${type==='service'?'Serviço realizado':'Material ou equipamento'}"></label><label>Quantidade<input type="number" min="0.01" step="0.01" required value="${i.qty}" oninput="draft.items[${n}].qty=Number(this.value);totals()"></label><label>Valor unitário<input type="number" min="0" step="0.01" required value="${i.price}" oninput="draft.items[${n}].price=Number(this.value);totals()"></label><button type="button" aria-label="Remover item" onclick="draft.items.splice(${n},1);items()">×</button></div>`).join('');totals()}function totals(){let m=draft.items.filter(i=>i.type!=='service').reduce((s,i)=>s+i.qty*i.price,0),s=sum(draft)-m;document.querySelector('#matTotal').textContent=money(m);document.querySelector('#srvTotal').textContent=money(s);document.querySelector('#total').textContent=money(m+s)}function save(back){Object.assign(draft,Object.fromEntries(new FormData(document.querySelector('#form'))));const old=structuredClone(orders);let index=orders.findIndex(o=>o.id===draft.id);if(index<0)orders.unshift(structuredClone(draft));else orders[index]=structuredClone(draft);if(!persist()){orders=old;return}if(back)home();toast('Atendimento salvo')}home();
</script></html>
